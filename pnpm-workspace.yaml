allowBuilds:
  # Bundles the Voice Lab worker; see the build:worker script.
  esbuild: true
  # Node-only native bindings pulled in by kokoro-js; the site uses the
  # browser (WASM) runtime, so their build scripts are safely skipped.
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
